<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link href="/assets/pico.min.css" rel="stylesheet">
</head>
<body>
    <div>
        <div class="grid">
           <h2>Chat!</h2>
           <label>Ich bin<input type="text" id="userIdInput" value="userXYZ"></label>
        </div>
        <div id="messages"></div>
        <input type="text" id="messageInput">
        <button id="sendButton">
            Send
        </button>
    </div>
    <script>
const ws = new WebSocket(`ws://${window.location.host}/ws`);
const messages = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const userIdInput = document.getElementById('userIdInput');
const sendButton = document.getElementById('sendButton');

ws.onopen = () => {
    console.log('Connected to the server');
};

ws.onmessage = (event) => {
    const message = document.createElement('div');
    const msg_obj = JSON.parse(event.data);
    if (msg_obj.type === "chat") {
        if (msg_obj.id == userIdInput.value) {
           message.innerHTML = "<kbd>"+msg_obj.msg+"</kbd>";
        } else {
           message.textContent = msg_obj.id + ": "+msg_obj.msg;
        }
        messages.appendChild(message);
    }
};

ws.onerror = (error) => {
    console.error('WebSocket error:', error);
};

ws.onclose = () => {
    console.log('Disconnected from the server');
};

sendButton.onclick = () => {
    const message = { "id": userIdInput.value, "type": "chat", "msg": messageInput.value };
    ws.send(JSON.stringify(message));
    messageInput.value = '';
};
    </script>
</body>
</html>
